name: PBT / Перевірка якості PR
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbt-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-control:
    name: Independent exact-main make gate (no main mutation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: '--junitxml=artifacts/base-junit.xml'
      PBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout immutable main base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 2
      - name: Python pinned v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify main baseline SHA, never update it
        run: test "$(git rev-parse HEAD)" = "$PBT_BASE_SHA"
      - name: Install independently hash-locked baseline test requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Install baseline browser media prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install --with-deps chromium webkit
      - name: Run unchanged main make gate at its immutable SHA
        run: make gate
      - name: Attach truthful baseline provenance
        run: |
          test -s artifacts/base-junit.xml
          printf '%s\n' "$PBT_BASE_SHA" > artifacts/base-commit.txt
      - name: Preserve baseline evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-main-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/base-junit.xml
            artifacts/base-commit.txt
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Native contracts → full gate → offline bundles / lab metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: '--junitxml=artifacts/full-junit.xml'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verified checkout (v7.0.1, Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verified Python (v7.1.0, Node 24)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Exact revision provenance (no PR synthetic merge mismatch)
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
      - name: Перевірка синтаксису без залежностей
        run: |
          python -m compileall -q tools tests server
          node --check web/js/site.js
          node --check web/js/data.js
          node --check web/js/cine.js
      - name: Чисте ядро кошторису — контракти, незалежний оракул, 2000 property cases
        run: |
          node --check web/js/quote.js
          node --test tests/quote_engine.test.cjs
      - name: Встановити залежності за SHA-256 із lock-файла
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: FFmpeg та системні бібліотеки браузерів
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install --with-deps chromium webkit
      - name: Швидкий контрактний smoke до дорогого повного gate
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_frontend_bootstrap.py \
            tests/test_menu_accessibility.py \
            tests/test_precision_design.py \
            tests/test_theme_tokens.py \
            tests/test_bundle_contract.py
      - name: Повний незмінений релізний гейт
        run: make gate
      - name: Immutable offline entrypoints and byte-level SHA-256
        run: |
          test -s artifacts/full-junit.xml
          test -s dist/pbt-site.html
          test -s dist/pbt-site.artifact.html
          test -s dist/artifact/index.html
          sha256sum dist/pbt-site.html dist/pbt-site.artifact.html dist/artifact/index.html > artifacts/offline-bundles.sha256
      - name: Preserve full-suite report and offline bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/full-junit.xml
            artifacts/offline-bundles.sha256
            dist/pbt-site.html
            dist/pbt-site.artifact.html
            dist/artifact/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Synthetic dual-theme mobile LCP/CLS evidence (not field INP)
        if: success()
        run: |
          export HOST=127.0.0.1 PORT=4180 LEAD_DB="$RUNNER_TEMP/pbt-perf-leads.db"
          python server/app.py > "$RUNNER_TEMP/pbt-perf-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4180/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:4180/api/health >/dev/null
          python tools/perf_probe.py --url http://127.0.0.1:4180/ --runs 3 \
            --out artifacts/perf/dual-theme-mobile.json
      - name: Preserve synthetic metrics (no release authorization)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-mobile-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/perf/dual-theme-mobile.json
          if-no-files-found: error
          retention-days: 14


  meta-self-test:
    name: Offline evidence verifier → positive + adversarial mutation controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Immutable exact-head checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify source revision, syntax and locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
          python -m compileall -q tools/meta_evidence_gate.py tools/evidence_collect.py tests/test_meta_evidence_gate.py tests/test_evidence_collect.py
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Self-falsification (positive and adversarial controls, identities from config/required-tests.json)
        run: |
          mkdir -p artifacts/meta
          python -m pytest -q -p no:cacheprovider --junitxml=artifacts/meta/junit.xml tests/test_meta_evidence_gate.py tests/test_evidence_collect.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('artifacts/meta/junit.xml').getroot()
          suites = root.findall('.//testsuite')
          tests = root.findall('.//testcase')
          assert len(tests) >= 40 and sum(int(s.attrib['tests']) for s in suites) == len(tests)
          assert all(all(int(s.attrib[k]) == 0 for k in ('failures','errors','skipped')) for s in suites)
          assert not root.findall('.//failure') and not root.findall('.//error')
          Path('artifacts/meta/exact-head.txt').write_text(__import__('os').environ['PBT_HEAD_SHA'] + '\n')
          PY
      - name: Preserve falsification proof (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-meta-selftest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/meta/junit.xml
            artifacts/meta/exact-head.txt
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: Critical fault catalog + assurance decision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Immutable exact-head checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Exact revision and locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Every designated fault must be killed by its oracle
        run: python tools/mutation_run.py --jobs 2 --out artifacts/mutation/mutation-ledger.json
      - name: Reviewed DOM sinks and three-valued release decision
        run: |
          python tools/dom_sinks.py
          python tools/assurance_check.py --target-sha "$PBT_HEAD_SHA" --out artifacts/mutation/assurance-decision.json
      - name: Preserve mutation ledger including survivors
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mutation/
          if-no-files-found: error
          retention-days: 14
