name: PBT / Vulnerability assurance (locked Python dependencies)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbt-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: SHA-pinned pip-audit / OSV → immutable receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Immutable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Exact source provenance and diff hygiene
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git show "${PBT_HEAD_SHA}:requirements.txt" | cmp - requirements.txt
          git diff --check HEAD^1 HEAD
      - name: Python 3.12 for vulnerability audit
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Remove any stale runner-local audit output
        run: rm -f /tmp/pip-audit-output.txt
      - name: Audit hash-locked requirements against OSV; no suppressions
        id: audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.txt
          no-deps: true
          require-hashes: true
          vulnerability-service: osv
      - name: Remove first audit output before complete pinned-input scan
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git show "${PBT_HEAD_SHA}:requirements.txt" | cmp - requirements.txt
          rm -f /tmp/pip-audit-output.txt
      - name: Audit every pinned requirement and emit JSON
        id: complete_audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.txt
          no-deps: true
          require-hashes: true
          vulnerability-service: osv
          # Avoid dry-run install-report omitting already installed packages.
          # This pins the input set, not the pip-audit version; distribution
          # hashes are verified separately by the release workflow.
          internal-be-careful-extra-flags: --format=json --disable-pip
      - name: Record exact source and audit step outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.complete_audit.outcome }}
          AUDIT_BASELINE_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_OUTPUT_B64: ${{ steps.complete_audit.outputs.internal-be-careful-output || steps.audit.outputs.internal-be-careful-output }}
        run: |
          mkdir -p artifacts/security
          python tools/security_receipt.py --requirements requirements.txt \
            --report /tmp/pip-audit-output.txt --output artifacts/security/osv-receipt.json
      - name: Remove primary output before SAST lock baseline scan
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git show "${PBT_HEAD_SHA}:requirements-sast.txt" | cmp - requirements-sast.txt
          rm -f /tmp/pip-audit-output.txt
      - name: Audit hash-locked SAST scanner requirements against OSV
        id: sast_audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-sast.txt
          no-deps: true
          require-hashes: true
          vulnerability-service: osv
      - name: Remove SAST baseline output before complete locked-input scan
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git show "${PBT_HEAD_SHA}:requirements-sast.txt" | cmp - requirements-sast.txt
          rm -f /tmp/pip-audit-output.txt
      - name: Audit every pinned SAST scanner requirement and emit JSON
        id: sast_complete_audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-sast.txt
          no-deps: true
          require-hashes: true
          vulnerability-service: osv
          internal-be-careful-extra-flags: --format=json --disable-pip
      - name: Record independent SAST lock outcome, fail closed
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.sast_complete_audit.outcome }}
          AUDIT_BASELINE_OUTCOME: ${{ steps.sast_audit.outcome }}
          AUDIT_OUTPUT_B64: ${{ steps.sast_complete_audit.outputs.internal-be-careful-output || steps.sast_audit.outputs.internal-be-careful-output }}
        run: |
          python tools/security_receipt.py --requirements requirements-sast.txt \
            --report /tmp/pip-audit-output.txt --output artifacts/security/osv-sast-receipt.json
      - name: Preserve fail-closed security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/osv-receipt.json
            artifacts/security/osv-sast-receipt.json
          if-no-files-found: error
          retention-days: 14

  scoped-static:
    name: Fail-closed AST policy / server + ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Immutable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify exact SHA and check source primitives
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
          python tools/security_static.py --roots server ops \
            --expected-head "$PBT_HEAD_SHA" --output artifacts/security/scoped-static.json
      - name: Preserve policy findings including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security/scoped-static.json
          if-no-files-found: error
          retention-days: 14

  broad-sast:
    name: Pinned broad scanner, SBOM, provenance receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Immutable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Hash-locked scanner
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-sast.txt
      - name: Provenance before anything is claimed about this revision
        run: |
          python tools/supply_chain.py capture --expected-head "$PBT_HEAD_SHA" --out artifacts/sast/provenance.json
          python tools/supply_chain.py verify artifacts/sast/provenance.json --expected-head "$PBT_HEAD_SHA"
          python tools/supply_chain.py sbom --out artifacts/sast/sbom.json
      - name: Broad scan with reviewed waivers; a scanner that did not scan fails
        run: python tools/sast_gate.py --out artifacts/sast/sast.json
      - name: Preserve scanner output including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sast/
          if-no-files-found: error
          retention-days: 14
