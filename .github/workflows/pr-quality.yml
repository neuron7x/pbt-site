name: PBT / Перевірка якості PR
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: pbt-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Синтаксис → API / UI / WCAG → bundle → screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Зафіксований checkout (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Зафіксований Python (setup-python v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Перевірка синтаксису без залежностей
        run: |
          python -m compileall -q tools tests server
          node --check web/js/site.js
          node --check web/js/data.js
          node --check web/js/cine.js
      - name: Встановити залежності за SHA-256 із lock-файла
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: FFmpeg та системні бібліотеки браузерів
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install --with-deps chromium webkit
      - name: Повний незмінений релізний гейт
        run: make gate
      - name: Зафіксувати реальні знімки desktop / mobile
        run: |
          export HOST=127.0.0.1 PORT=4180 LEAD_DB="$RUNNER_TEMP/pbt-visual-leads.db"
          python server/app.py > "$RUNNER_TEMP/pbt-visual-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4180/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:4180/api/health >/dev/null
          make shots
      - name: Зберегти оглядові знімки PR (не тести)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbt-visual-${{ github.run_id }}
          path: artifacts/shots/*.png
          if-no-files-found: ignore
          retention-days: 7
