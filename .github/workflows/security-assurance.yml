name: PBT / Vulnerability assurance (locked Python dependencies)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pbt-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: SHA-pinned pip-audit / OSV → immutable receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Immutable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Exact source provenance and diff hygiene
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
      - name: Python 3.12 for vulnerability audit
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Audit hash-locked requirements against OSV; no suppressions
        id: audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.txt
          no-deps: true
          require-hashes: true
          vulnerability-service: osv
      - name: Record exact source and audit step outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_OUTPUT_B64: ${{ steps.audit.outputs.internal-be-careful-output }}
        run: |
          mkdir -p artifacts/security
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          output_b64 = os.environ.get('AUDIT_OUTPUT_B64', '')
          try:
              report_text = base64.b64decode(output_b64, validate=True).decode('utf-8')
          except (ValueError, UnicodeDecodeError) as exc:
              raise SystemExit(f'auditor output encoding invalid: {type(exc).__name__}')
          source = Path('requirements.txt').read_bytes()
          record = {
              'schema': 'pbt-osv-audit-receipt-v1',
              'head_sha': os.environ['PBT_HEAD_SHA'],
              'action_commit': '1220774d901786e6f652ae159f7b6bc8fea6d266',
              'input': 'requirements.txt',
              'requirements_sha256': hashlib.sha256(source).hexdigest(),
              'service': 'OSV',
              'require_hashes': True,
              'no_deps': True,
              'outcome': os.environ['AUDIT_OUTCOME'],
              'scanner_output_sha256': hashlib.sha256(report_text.encode('utf-8')).hexdigest(),
              'scanner_output': report_text,
              'claim_boundary': 'step-success is a dependency audit, not ASVS certification',
          }
          Path('artifacts/security/osv-receipt.json').write_text(
              json.dumps(record, sort_keys=True, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Preserve fail-closed security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security/osv-receipt.json
          if-no-files-found: error
          retention-days: 14

  scoped-static:
    name: Fail-closed AST policy / server + ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Immutable checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify exact SHA and check source primitives
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
          python tools/security_static.py --roots server ops \
            --expected-head "$PBT_HEAD_SHA" --output artifacts/security/scoped-static.json
      - name: Preserve policy findings including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security/scoped-static.json
          if-no-files-found: error
          retention-days: 14
