name: PBT / Доказовий дизайн та медіабюджет

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: pbt-visual-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-proof:
    name: Пороги → повний gate → 7 в'юпортів → SHA-256
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Перевірений checkout (v4.2.2, commit SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Перевірений Python (v5.6.0, commit SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Базовий синтаксис Python і JavaScript
        run: |
          python -m compileall -q tools tests server
          node --check web/js/site.js
          node --check web/js/data.js
          node --check web/js/cine.js
      - name: Встановити hash-locked залежності
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Встановити ffmpeg та Chromium / WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install --with-deps chromium webkit
      - name: Повний release gate + media budget
        run: make gate
      - name: Зберегти відтворювані desktop/mobile скриншоти
        run: |
          export HOST=127.0.0.1 PORT=4180 LEAD_DB="$RUNNER_TEMP/pbt-visual-audit.db"
          python server/app.py > "$RUNNER_TEMP/pbt-visual-audit.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4180/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:4180/api/health >/dev/null
          make shots
      - name: Архів доказів із manifest.json і SHA-256
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbt-visual-proof-${{ github.run_id }}
          path: |
            artifacts/shots/
            artifacts/media-budget.json
          if-no-files-found: ignore
          retention-days: 7
