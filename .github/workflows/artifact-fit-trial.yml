# Read-only diagnostic, NOT a release gate bypass.
name: PBT / Actual-media SSIM fitting trial (non-deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/artifact-fit-trial.yml'
      - 'tools/artifact_video_fit.py'
      - 'tools/artifact_budget.py'
      - 'tools/inline.py'
      - 'tests/test_artifact_video_fit.py'
      - 'tests/test_reproducibility.py'
permissions:
  contents: read
concurrency:
  group: pbt-artifact-fit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  media-fit-trial:
    name: Real source bytes → SSIM oracle → explicit non-release verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout immutable exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PBT_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - name: Pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify source and prepare locked codec tests
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe
      - name: Run synthetic codec, source and size negative controls
        run: |
          mkdir -p artifacts/video-fit
          python -m pytest -q -p no:cacheprovider \
            --junitxml=artifacts/video-fit/junit.xml \
            tests/test_artifact_video_fit.py \
            tests/test_artifact_budget_preflight.py \
            tests/test_reproducibility.py
      - name: Build exact source media and record deterministic rejection
        run: |
          set +e
          python tools/inline.py > artifacts/video-fit/builder.log 2>&1
          result=$?
          set -e
          export BUILDER_EXIT="$result"
          test -s dist/artifact/index.html
          test -s dist/artifact-budget-preflight.json
          test -s dist/artifact-budget.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          pre=json.loads(Path('dist/artifact-budget-preflight.json').read_text())
          post=json.loads(Path('dist/artifact-budget.json').read_text())
          assert pre['files']==post['files'] and pre['total_bytes']==post['total_bytes']
          assert post['asset_count']>=132 and post['limit_bytes']==64*1024*1024
          rc=int(os.environ['BUILDER_EXIT'])
          if post['ok']:
              assert rc==0
          else:
              assert rc!=0
              assert 'Multifile artifact exceeds' in Path('artifacts/video-fit/builder.log').read_text()
          summary={'source_sha':os.environ['PBT_HEAD_SHA'],'builder_exit':rc,
                   'preflight_bytes':pre['total_bytes'],'cap_bytes':post['limit_bytes'],
                   'excess_bytes':post['over_budget_bytes'],'unoptimized_fits':post['ok']}
          Path('artifacts/video-fit/source-summary.json').write_text(
              json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
      - name: Run separately bounded SSIM trial on COPIED MP4 only
        run: |
          set +e
          python tools/artifact_video_fit.py --root dist/artifact \
            --report artifacts/video-fit/codec.json \
            > artifacts/video-fit/fit.log 2>&1
          result=$?
          set -e
          export FIT_EXIT="$result"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('artifacts/video-fit/codec.json').read_text())
          assert data['release_authorization']=='NOT_GRANTED'
          assert data['limit_bytes']==64*1024*1024
          assert data['saved_bytes']==data['preflight_bytes']-data['final_bytes']
          assert int(os.environ['FIT_EXIT'])==(0 if data['ok'] else 1)
          assert Path('artifacts/video-fit/artifact-budget-after-fit.json').is_file()
          print(json.dumps({'actual_fit_ok':data['ok'],
                            'saved_bytes':data['saved_bytes'],
                            'final_bytes':data['final_bytes']},sort_keys=True))
          PY
          # A noncompliant real artifact must keep this trial RED.
          test "$result" -eq 0
      - name: Preserve real-byte and SSIM evidence even when trial fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-media-fit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/video-fit/
            dist/artifact-budget-preflight.json
            dist/artifact-budget.json
          if-no-files-found: warn
          retention-days: 14
