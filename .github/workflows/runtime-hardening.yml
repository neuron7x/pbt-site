name: PBT / Transport reliability gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/runtime-hardening.yml'

permissions:
  contents: read

concurrency:
  group: pbt-transport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Adversarial HTTP → CRM/HMAC invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: '--junitxml=artifacts/http-junit.xml'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout pinned v7.0.1 (Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Python pinned v7.1.0 (Node 24)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Exact tested HEAD and whitespace invariants
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
      - name: Syntax
        run: |
          python -m compileall -q server tests tools
          node --check web/js/site.js
          node --check web/js/data.js
          node --check web/js/cine.js
          node --check web/js/quote.js
      - name: Hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Targeted falsification + API/CRM regressions
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_request_body_deadline.py tests/test_api.py \
            tests/test_leads.py tests/test_hardening.py
      - name: Preserve adversarial HTTP JUnit without redundant browser installation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbt-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/http-junit.xml
          if-no-files-found: error
          retention-days: 14
