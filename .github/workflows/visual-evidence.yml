name: PBT / Доказовий дизайн та медіабюджет

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pbt-visual-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-proof:
    name: Independent visual proofs → 2 themes × 6 viewports → SHA-256
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PBT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verified checkout (v7.0.1, Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Verified Python (v7.1.0, Node 24)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Exact tested HEAD (no synthetic merge substitution)
        run: |
          test "$(git rev-parse HEAD)" = "$PBT_HEAD_SHA"
          git diff --check HEAD^1 HEAD
      - name: Базовий синтаксис Python і JavaScript
        run: |
          python -m compileall -q tools tests server
          node --check web/js/site.js
          node --check web/js/data.js
          node --check web/js/cine.js
          node --check web/js/quote.js
      - name: Встановити hash-locked залежності
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Встановити ffmpeg та Chromium / WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install --with-deps chromium webkit
      - name: Visual falsification + actual media budget (full make gate runs in pr-quality)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_visual_contract.py tests/test_media_budget.py \
            tests/test_compare_shots.py tests/test_evidence_gate.py
          make media-audit
      - name: Зберегти відтворювані desktop/mobile скриншоти
        run: |
          export HOST=127.0.0.1 PORT=4180 LEAD_DB="$RUNNER_TEMP/pbt-visual-audit.db"
          python server/app.py > "$RUNNER_TEMP/pbt-visual-audit.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4180/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:4180/api/health >/dev/null
          make shots
      - name: Independent evidence validator (bytes, source SHA, media inventory)
        run: python tools/evidence_gate.py --expected-sha "$PBT_HEAD_SHA"
      - name: Архів доказів із manifest.json і SHA-256
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pbt-visual-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/shots/
            artifacts/media-budget.json
            artifacts/evidence-verification.json
          if-no-files-found: error
          retention-days: 14
