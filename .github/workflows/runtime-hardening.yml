name: PBT / Transport reliability gate

on:
  push:
    branches:
      - 'codex/pbt-transport-deadline-*'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/runtime-hardening.yml'

permissions:
  contents: read

concurrency:
  group: pbt-transport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Adversarial HTTP → full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python pinned action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m compileall -q server tests tools
          node --check web/js/site.js
          node --check web/js/data.js
          node --check web/js/cine.js
      - name: Hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Browser dependencies and media tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install --with-deps chromium webkit
      - name: Targeted falsification + API/CRM regressions
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_request_body_deadline.py tests/test_api.py \
            tests/test_leads.py tests/test_hardening.py
      - name: Full release gate without weakened thresholds
        run: make gate
