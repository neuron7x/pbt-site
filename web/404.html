<!doctype html>
<html lang="uk" data-theme="sky">
<head>

<script>/* Тема до CSS. Без мережі, трекерів і припущення про доступність Storage. */
(function(d){var t='sky';try{if(localStorage.getItem('pbt-theme')==='precision')t='precision'}catch(_e){}d.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='precision'?'#101820':'#040A16'})(document.documentElement)
</script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/site.css">
</head>

    <p class="lead">Адреса застаріла або набрана з помилкою. Техніка, ціни й заявка — на головній.</p>
    <p class="row"><a class="btn" href="/">На головну</a><a class="btn btn--ghost" href="/#zapyt">Залишити заявку</a></p>

</html>
